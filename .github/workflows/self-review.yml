# このリポジトリ自身の PR も、同じワークフローでレビューさせる。
#
# examples/pr-review.yml と違い `uses:` はローカル参照にしてある。pull_request
# では PR 側のコミットから読まれるので、プロンプトを変えた PR はその新しい
# プロンプト自身でレビューされる。壊した場合もその PR の上で分かる。
#
# 信頼境界は「このリポジトリへの push 権限」であって、レビュー方針ではない。
# fork からの PR は呼び出され側の job の if で落ちるので、外部が prompt を
# 書き換えて実行させることはできない。一方、push 権限を持つ人は PR を出すだけで
# (マージ承認なしに) 書き換えた prompt を走らせられる。pull_request では
# ワークフローが head 側から読まれるためで、`uses:` を main 固定にしても
# 塞がらない (このファイル自体も head 側から読まれるので、ステップを足せば
# 同じことができる)。id-token: write が付いている以上、SSM の Claude OAuth token と
# Codex auth.json は push 権限を持つ人からは隠せず、後者の書き換えもできる。
name: Self Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 呼び出される側の permissions は呼び出し側を超えられない
permissions:
  contents: read
  pull-requests: write
  issues: write
  # claude-review / codex-review チェックを PR のチェック一覧に出すため
  statuses: write
  # Claude/Codex の認証情報を SSM から読むための OIDC トークン発行
  id-token: write
  # CI の実行結果を Claude に読ませるため (github_ci MCP に必要)
  actions: read

concurrency:
  group: self-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# トークンはこのリポジトリの secret には置かず、SSM から OIDC で読む。
# ロールの信頼ポリシーが repo:tamura09/*:pull_request なので、このリポジトリも
# そのまま対象に入る。
jobs:
  review:
    uses: ./.github/workflows/pr-review.yml
    with:
      extra_instructions: |
        このリポジトリの中身は GitHub Actions のワークフローと、その使い方を
        書いた README・サンプルだけです。次を重点的に見てください。

        - 式展開 (`github.event.*` や `inputs.*` の値) を `run:` のスクリプトに
          直接埋めていないか。env 経由で受けないとシェルに注入できる
        - `permissions` が必要以上に広くないか。fork からの PR を落とす job の
          `if` が効いたままか
        - トークンやパラメータの値がログや `GITHUB_OUTPUT` 経由で漏れないか
          (`add-mask` の漏れ、`set -x` の混入)
        - 各 leg が自分のモデルの認証情報だけを読んでいるか (Claude の leg で Codex の
          auth.json を読んでいないか、その逆も)。各モデルの実行前に AWS の一時認証情報を
          消し、Codex refresh 後だけ auth.json を SSM へ戻しているか
        - Claude と Codex のコメントを判定ステップが取り違えないか (目印の有無と leg の
          対応)。claude-review / codex-review が leg ごとに1つずつ出るか
        - effort を決める変更行数の数え方と閾値の比較が、README の説明と一致しているか
        - 呼び出され側のプロンプトが出力させる verdict 行の書式と、それを読む
          チェック出力ステップの正規表現が食い違っていないか
        - README と examples/pr-review.yml が、実際の入力名・既定値・権限と
          一致しているか。ワークフローを変えたら両方の追随が要る
