# 呼び出し側リポジトリの .github/workflows/pr-review.yml に置く。
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 呼び出される側の permissions は呼び出し側を超えられない。
# リポジトリ既定の GITHUB_TOKEN が read-only の場合、ここで明示しないと
# レビューの投稿に失敗する。
permissions:
  contents: read
  pull-requests: write
  issues: write
  # claude-review チェックを PR のチェック一覧に出すため
  statuses: write
  # Claude/Codex の認証情報を AWS の SSM から読むための OIDC トークン発行
  id-token: write
  # CI の実行結果を Claude に読ませるため (github_ci MCP に必要)
  actions: read

# 連続 push のたびに走らせず、最新のコミットだけレビューする
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 認証情報はこのリポジトリの secret には置かない。AWS の SSM に Claude OAuth
# token と Codex auth.json が1本ずつあり、呼び出されたワークフローが OIDC で読む。
# 上の id-token: write がそのために要る。
jobs:
  review:
    # `@v1` と書いておけば、Renovate が初回の実行で `@<sha> # v1` に固定し、
    # 以後は v1 の移動を digest 更新として追う。手で SHA を調べる必要はない。
    uses: tamura09/pr-review/.github/workflows/pr-review.yml@v1
    # 必要に応じて上書きする
    # with:
    #   effort: high  # 変更行数に関係なく固定したい場合
    #   findings_state: success  # 指摘があっても PR を赤くしたくない場合
    #   extra_instructions: |
    #     このリポジトリは Prisma のスキーマ変更がマイグレーションを伴う。
    #     prisma/schema.prisma の変更があれば、対応するマイグレーションの有無を確認すること。
    #
    # AWS を使わず、このリポジトリの secrets で認証情報を渡すこともできる。
    # secrets:
    #   claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    #   codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
